name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    name: Baseline (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    # 45, not 30: this one job runs the complete race suite AND the browser suites. Observed on the P1.18 head: 16 to 19 minutes, with the
    # suite still growing; 30 left too little headroom (P1.18.4 AUTH-CI-BUDGET; scripts/ci-budget.test.mjs pins this and the other budgets).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        go: ['1.27.4', '1.26.11']
    env:
      MANDATARY_GO_VERSION: ${{ matrix.go }}
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: '-mod=readonly -p=4'
      GOMEMLIMIT: 12GiB
      GOGC: '100'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use a private temporary root for storage fixtures
        run: |
          test_root=$(mktemp -d "$HOME/mandatary-tests.XXXXXXXX")
          printf 'TMPDIR=%s\n' "$test_root" >> "$GITHUB_ENV"
          stat -c '%a %u:%g %n' / /home "$HOME" "$test_root"
      - run: make install check GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100
      - name: Install pinned Chromium and system dependencies
        run: web/node_modules/.bin/playwright install --with-deps chromium
      - run: make browser-test GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100
  # The negative control re-runs the complete race suite against a deliberately
  # wrong security expectation (scripts/negative-control.sh; it accepts only the
  # intended exposed-route failure, see scripts/negative-control-verify.mjs). It runs on
  # its own runner per pinned Go version, in parallel with Baseline and without
  # depending on it, so neither serial full-suite run exhausts the other's budget.
  negative-control:
    name: Negative control (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        go: ['1.27.4', '1.26.11']
    env:
      MANDATARY_GO_VERSION: ${{ matrix.go }}
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: '-mod=readonly -p=4'
      GOMEMLIMIT: 12GiB
      GOGC: '100'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use a private temporary root for storage fixtures
        run: |
          test_root=$(mktemp -d "$HOME/mandatary-tests.XXXXXXXX")
          printf 'TMPDIR=%s\n' "$test_root" >> "$GITHUB_ENV"
          stat -c '%a %u:%g %n' / /home "$HOME" "$test_root"
      # build embeds the pinned web bundle the security tests serve; sqlc is the
      # pinned generator the repository tests invoke (as in `make test`).
      - run: make install build sqlc negative-control GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100
  storage-arm64:
    name: Storage (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: '-mod=readonly -p=4'
      GOMEMLIMIT: 12GiB
      GOGC: '100'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use a private temporary root for storage fixtures
        run: |
          test_root=$(mktemp -d "$HOME/mandatary-tests.XXXXXXXX")
          printf 'TMPDIR=%s\n' "$test_root" >> "$GITHUB_ENV"
          stat -c '%a %u:%g %n' / /home "$HOME" "$test_root"
      - run: uname -m && make install build GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100 && go test -race -timeout=30m -count=1 -v ./...
  security:
    name: Security
    # Fail-closed aggregation: the Security check (already required) can only pass
    # when every Baseline and every negative-control job passed. always() makes it
    # run and turn red, rather than silently skip, when an upstream job failed.
    needs: [baseline, negative-control]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: '-mod=readonly -p=4'
      GOMEMLIMIT: 12GiB
      GOGC: '100'
      BASELINE_RESULT: ${{ needs.baseline.result }}
      NEGATIVE_CONTROL_RESULT: ${{ needs.negative-control.result }}
    steps:
      - name: Require every Baseline and negative-control job to have passed
        run: |
          printf 'baseline=%s negative-control=%s\n' "$BASELINE_RESULT" "$NEGATIVE_CONTROL_RESULT"
          [[ "$BASELINE_RESULT" == success && "$NEGATIVE_CONTROL_RESULT" == success ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make install build tools security GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100
