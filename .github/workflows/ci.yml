name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    name: Baseline (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    # 45, not 30: this one job runs the complete race suite AND the browser suites. Observed hosted durations at the P1.18.4 head: Go 1.27.4 about
    # 19 minutes, Go 1.26.11 about 26 minutes (the older toolchain is slower), with the suite still growing; 30 left too little headroom
    # (P1.18.4 AUTH-CI-BUDGET; scripts/ci-budget.test.mjs pins this and the other budgets).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        go: ['1.27.4', '1.26.11']
    env:
      MANDATARY_GO_VERSION: ${{ matrix.go }}
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: '-mod=readonly -p=4'
      GOMEMLIMIT: 12GiB
      GOGC: '100'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use a private temporary root for storage fixtures
        run: |
          test_root=$(mktemp -d "$HOME/mandatary-tests.XXXXXXXX")
          printf 'TMPDIR=%s\n' "$test_root" >> "$GITHUB_ENV"
          stat -c '%a %u:%g %n' / /home "$HOME" "$test_root"
      - run: make install check GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100
      - name: Install pinned Chromium and system dependencies
        run: web/node_modules/.bin/playwright install --with-deps chromium
      - run: make browser-test GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100
  # The negative control re-runs the complete race suite against a deliberately
  # wrong security expectation (scripts/negative-control.sh; it accepts only the
  # intended exposed-route failure, see scripts/negative-control-verify.mjs). It runs on
  # its own runner per pinned Go version, in parallel with Baseline and without
  # depending on it, so neither serial full-suite run exhausts the other's budget.
  negative-control:
    name: Negative control (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        go: ['1.27.4', '1.26.11']
    env:
      MANDATARY_GO_VERSION: ${{ matrix.go }}
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: '-mod=readonly -p=4'
      GOMEMLIMIT: 12GiB
      GOGC: '100'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use a private temporary root for storage fixtures
        run: |
          test_root=$(mktemp -d "$HOME/mandatary-tests.XXXXXXXX")
          printf 'TMPDIR=%s\n' "$test_root" >> "$GITHUB_ENV"
          stat -c '%a %u:%g %n' / /home "$HOME" "$test_root"
      # build embeds the pinned web bundle the security tests serve; sqlc is the
      # pinned generator the repository tests invoke (as in `make test`).
      - run: make install build sqlc negative-control GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100
  storage-arm64:
    name: Storage (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: '-mod=readonly -p=4'
      GOMEMLIMIT: 12GiB
      GOGC: '100'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use a private temporary root for storage fixtures
        run: |
          test_root=$(mktemp -d "$HOME/mandatary-tests.XXXXXXXX")
          printf 'TMPDIR=%s\n' "$test_root" >> "$GITHUB_ENV"
          stat -c '%a %u:%g %n' / /home "$HOME" "$test_root"
      - run: uname -m && make install build GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100 && go test -race -timeout=30m -count=1 -v ./...
  # Production image (P1.19): built and RUN natively on each supported CPU (a cross-compile alone is not evidence), on a
  # disposable hosted VM that is its own isolated Docker daemon (security-contracts.md S1.4: no production socket). The
  # acceptance harness (tests/image/acceptance.py) exercises the image facts, hardening, the SELF readiness matrix against
  # the real daemon and the full Compose + TLS proxy + TLS SMTP fixture + setup flow. Trivy (pinned by digest, run as an
  # unprivileged container over an image tarball, never given the Docker socket) is the TD 2.3 image gate: any HIGH or
  # CRITICAL finding, or a scanner/DB failure, fails the job.
  image:
    name: Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record the build host
        run: |
          uname -m
          docker version --format 'server={{.Server.Version}} api={{.Server.APIVersion}} {{.Server.Os}}/{{.Server.Arch}}'
          docker compose version
          git rev-parse HEAD
      - name: Build the image and the host-helper artifact
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          docker build --platform ${{ matrix.platform }} --build-arg VCS_REF="$sha" -t mandatary-ci:${{ matrix.arch }} .
          docker build --platform ${{ matrix.platform }} --target host-binary --build-arg VCS_REF="$sha" --output type=local,dest="$RUNNER_TEMP/out" .
          docker image inspect mandatary-ci:${{ matrix.arch }} --format 'id={{.Id}} size={{.Size}} arch={{.Architecture}}'
      - name: Image acceptance (hardening, SELF, Compose + TLS proxy + SMTP, SETUP)
        run: |
          set -euo pipefail
          work=$(mktemp -d "$HOME/mandatary-image.XXXXXXXX")
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 tests/image/acceptance.py --image mandatary-ci:${{ matrix.arch }} --platform ${{ matrix.platform }} --repo . \
            --work "$work" --host-binary "$RUNNER_TEMP/out/mandatary" --sha "$(git rev-parse HEAD)" \
            --results "$RUNNER_TEMP/evidence/results-${{ matrix.arch }}.json"
      - name: SBOM and Trivy HIGH/CRITICAL gate
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/evidence"; mkdir -p "$ev"; chmod 0777 "$ev"
          docker save mandatary-ci:${{ matrix.arch }} -o "$ev/image.tar"; chmod 0644 "$ev/image.tar"
          trivy() { docker run --rm --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp -e TRIVY_CACHE_DIR=/cache -v trivy-cache:/cache -v "$ev:/work" "$TRIVY_IMAGE" "$@"; }
          trivy --version | tee "$ev/trivy-version.txt"
          trivy image --input /work/image.tar --format cyclonedx --output /work/sbom-${{ matrix.arch }}.cdx.json
          trivy image --input /work/image.tar --severity HIGH,CRITICAL --exit-code 1 --format json --output /work/trivy-high-critical-${{ matrix.arch }}.json
          rm -f "$ev/image.tar"
          sha256sum "$ev"/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: image-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30
  security:
    name: Security
    # Fail-closed aggregation: the Security check (already required) can only pass
    # when every Baseline and every negative-control job passed. always() makes it
    # run and turn red, rather than silently skip, when an upstream job failed.
    needs: [baseline, negative-control, image]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: '-mod=readonly -p=4'
      GOMEMLIMIT: 12GiB
      GOGC: '100'
      BASELINE_RESULT: ${{ needs.baseline.result }}
      NEGATIVE_CONTROL_RESULT: ${{ needs.negative-control.result }}
      IMAGE_RESULT: ${{ needs.image.result }}
    steps:
      - name: Require every Baseline, negative-control and image job to have passed
        run: |
          printf 'baseline=%s negative-control=%s image=%s\n' "$BASELINE_RESULT" "$NEGATIVE_CONTROL_RESULT" "$IMAGE_RESULT"
          [[ "$BASELINE_RESULT" == success && "$NEGATIVE_CONTROL_RESULT" == success && "$IMAGE_RESULT" == success ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make install build tools security GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100
