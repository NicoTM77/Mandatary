name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    name: Baseline (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        go: ['1.27.3', '1.26.10']
    env:
      MANDATARY_GO_VERSION: ${{ matrix.go }}
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: '-mod=readonly -p=4'
      GOMEMLIMIT: 12GiB
      GOGC: '100'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use a private temporary root for storage fixtures
        run: |
          test_root=$(mktemp -d "$HOME/mandatary-tests.XXXXXXXX")
          printf 'TMPDIR=%s\n' "$test_root" >> "$GITHUB_ENV"
          stat -c '%a %u:%g %n' / /home "$HOME" "$test_root"
      - run: make install check negative-control GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100
      - name: Install pinned Chromium and system dependencies
        run: web/node_modules/.bin/playwright install --with-deps chromium
      - run: make browser-test GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100
  storage-arm64:
    name: Storage (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: '-mod=readonly -p=4'
      GOMEMLIMIT: 12GiB
      GOGC: '100'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use a private temporary root for storage fixtures
        run: |
          test_root=$(mktemp -d "$HOME/mandatary-tests.XXXXXXXX")
          printf 'TMPDIR=%s\n' "$test_root" >> "$GITHUB_ENV"
          stat -c '%a %u:%g %n' / /home "$HOME" "$test_root"
      - run: uname -m && make install build GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100 && go test -race -timeout=20m -count=1 -v ./...
  security:
    name: Security
    needs: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: '-mod=readonly -p=4'
      GOMEMLIMIT: 12GiB
      GOGC: '100'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make install build tools security GOFLAGS="-mod=readonly -p=4" GOMAXPROCS=4 GOMEMLIMIT=12GiB GOGC=100
